# Policy decisions hold actions for env.action_repeat physics ticks.
env:
  world_size: 800.0
  tickrate: 60
  max_acc: 300.0
  max_speed: 250.0
  chaser_advantage: 1.2
  friction: 0.1
  capture_radius: 25.0
  timeout_steps: 1000
  action_repeat: 4
  distance_reward_scale: 100.0
  capture_reward: 10.0
agent:
  algorithm: td3
  hidden: 128
  lr: 0.0003
  gamma: 0.99
  sample_actions: 128
  batch_size: 128
  buffer_capacity: 50000
  target_update_freq: 400
  target_samples: 32
  grad_clip: 10.0
  min_buffer: 1000
  start_steps: 1000
  tau: 0.005
  policy_delay: 2
  policy_noise: 0.2
  noise_clip: 0.5
train:
  total_steps: 200000
  train_iters_per_step: 1
  eps_start: 0.3
  eps_final: 0.05
  eps_decay_steps: 100000
  log_interval: 100
  save_interval: 5000
  seed: 0
  eval_interval: 10000
  eval_episodes: 20
  eval_seed: 10000
  snapshot_interval: 2000
  opponent_pool_size: 8
  random_opponent_prob: 0.2
  scripted_opponent_prob: 0.3
  keep_checkpoints: 3
  torch_threads: 1
